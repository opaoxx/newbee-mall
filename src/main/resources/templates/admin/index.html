<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<header th:replace="admin/header::header-fragment"></header>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
    <div th:replace="admin/header::header-nav"></div>
    <div th:replace="admin/sidebar::sidebar-fragment(${path})"></div>
    <main class="content-wrapper">
        <div class="content-header">
            <div class="container-fluid">
                <h1 class="m-0">商城概况</h1>
            </div>
        </div>
        <div class="content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12 col-sm-6 col-xl-3">
                        <div class="small-box bg-info">
                            <div class="inner">
                                <h2 class="font-weight-bold" id="totalGoods" th:text="${dashboardSummary.totalGoods}">0</h2>
                                <p>商品总数</p>
                            </div>
                            <div class="icon" aria-hidden="true"><i class="fa fa-cubes"></i></div>
                            <a th:href="@{/admin/goods}" class="small-box-footer">商品管理 <i class="fa fa-arrow-circle-right" aria-hidden="true"></i></a>
                        </div>
                    </div>
                    <div class="col-12 col-sm-6 col-xl-3">
                        <div class="small-box bg-success">
                            <div class="inner">
                                <h2 class="font-weight-bold" id="onSaleGoods" th:text="${dashboardSummary.onSaleGoods}">0</h2>
                                <p>上架商品数</p>
                            </div>
                            <div class="icon" aria-hidden="true"><i class="fa fa-tag"></i></div>
                            <a th:href="@{/admin/goods}" class="small-box-footer">商品管理 <i class="fa fa-arrow-circle-right" aria-hidden="true"></i></a>
                        </div>
                    </div>
                    <div class="col-12 col-sm-6 col-xl-3">
                        <div class="small-box bg-primary">
                            <div class="inner">
                                <h2 class="font-weight-bold" id="memberCount" th:text="${dashboardSummary.memberCount}">0</h2>
                                <p>会员数 <span class="small">未注销</span></p>
                            </div>
                            <div class="icon" aria-hidden="true"><i class="fa fa-users"></i></div>
                            <a th:href="@{/admin/users}" class="small-box-footer">会员管理 <i class="fa fa-arrow-circle-right" aria-hidden="true"></i></a>
                        </div>
                    </div>
                    <div class="col-12 col-sm-6 col-xl-3">
                        <div class="small-box bg-secondary">
                            <div class="inner">
                                <h2 class="font-weight-bold" id="orderCount" th:text="${dashboardSummary.orderCount}">0</h2>
                                <p>订单数 <span class="small">未删除</span></p>
                            </div>
                            <div class="icon" aria-hidden="true"><i class="fa fa-list-alt"></i></div>
                            <a th:href="@{/admin/orders}" class="small-box-footer">订单管理 <i class="fa fa-arrow-circle-right" aria-hidden="true"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="admin/footer::footer-fragment"></div>
</div>
<script th:src="@{/admin/plugins/jquery/jquery.min.js}"></script>
<script th:src="@{/admin/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/admin/dist/js/adminlte.min.js}"></script>
</body>
</html>
